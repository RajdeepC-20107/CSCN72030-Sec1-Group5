name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore "UnitTests/UnitTests.csproj"

    - name: Build
      run: dotnet build "UnitTests/UnitTests.csproj" --configuration ${{ matrix.configuration }} --no-restore

    - name: Run unit tests
      run: dotnet test "UnitTests/UnitTests.csproj" --configuration ${{ matrix.configuration }} --no-build --no-restore
